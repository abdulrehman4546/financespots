name: Deploy to mHosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SFTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SFTP (lftp)
        run: |
          sudo apt-get install -y lftp
          lftp -c "
          set sftp:auto-confirm yes;
          set net:timeout 30;
          set net:max-retries 3;
          open sftp://${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}@${{ secrets.FTP_SERVER }};
          mirror -R --parallel=4 \
            --exclude='^\.git' \
            --exclude='^\.github' \
            --exclude='^\.claude' \
            --exclude='wp-config\.php$' \
            --exclude='wp-content/uploads/' \
            --exclude='node_modules/' \
            --exclude='financespots_export\.sql$' \
            --exclude='wp-config-HOSTING\.php$' \
            --exclude='check-widgets\.php$' \
            --exclude='deploy-guide\.html$' \
            ./ /public_html/;
          bye;
          "
