name: Deploy theme to hosting (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload theme via FTPS
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Upload wp-content/themes/financespots
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./wp-content/themes/financespots/
          server-dir: ${{ secrets.FTP_THEME_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            **/node_modules/**

      # Root-level housekeeping files. Plain curl upload of a fixed whitelist (no directory
      # listing, which the host resets). Overwrites the retired maintenance scripts with a
      # 410 stub and publishes llms.txt. Nothing else in public_html is touched.
      - name: Upload root housekeeping files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          NETRC="$(mktemp)"; chmod 600 "$NETRC"
          printf 'machine %s login %s password %s\n' "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD" > "$NETRC"
          for f in fix-uploads.php create-blogs.php llms.txt; do
            curl -sS --fail --ssl-reqd --retry 3 --retry-delay 3 --netrc-file "$NETRC" \
              -T "deploy-root/$f" "ftp://$FTP_SERVER/public_html/$f"
            echo "uploaded $f"
          done
          rm -f "$NETRC"
