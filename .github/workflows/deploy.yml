name: Deploy to mHosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SFTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test SFTP connection + list dirs
        run: |
          sudo apt-get install -y lftp
          lftp -d -c "
          set sftp:auto-confirm yes;
          set net:timeout 60;
          set net:max-retries 2;
          open sftp://${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}@${{ secrets.FTP_SERVER }};
          ls;
          bye;
          " 2>&1 | head -80
