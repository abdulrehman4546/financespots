#!/usr/bin/env bash
# Upload theme files to the live site over FTPS using curl (no FTP client needed).
#
# Setup once:  cp deploy/ftp-credentials.example deploy/.ftp-credentials  and fill it in.
# Usage:
#   deploy/ftp-deploy.sh --dry-run                 # list what would be uploaded
#   deploy/ftp-deploy.sh                           # upload files changed since origin/main
#   deploy/ftp-deploy.sh --since <git-ref>         # upload files changed since that ref
#   deploy/ftp-deploy.sh --all                     # upload every tracked theme file
#   deploy/ftp-deploy.sh path/to/file.php ...      # upload specific files
#   add --verify <url> to fetch a live URL afterwards and print its HTTP status
#
# Only files under wp-content/themes/financespots/ are ever uploaded.
# wp-config.php, .htaccess and wp-content/uploads are never touched.
set -euo pipefail
cd "$(dirname "$0")/.."

THEME_LOCAL="wp-content/themes/financespots"
CRED="deploy/.ftp-credentials"
DRY=0; MODE="since"; REF="origin/main"; VERIFY=""; FILES=()

while [ $# -gt 0 ]; do
  case "$1" in
    --dry-run) DRY=1 ;;
    --all) MODE="all" ;;
    --since) MODE="since"; REF="$2"; shift ;;
    --verify) VERIFY="$2"; shift ;;
    -h|--help) sed -n '2,15p' "$0"; exit 0 ;;
    *) MODE="files"; FILES+=("$1") ;;
  esac; shift
done

if [ ! -f "$CRED" ]; then echo "Missing $CRED (copy deploy/ftp-credentials.example and fill it in)"; exit 1; fi
# shellcheck disable=SC1090
source "$CRED"
: "${FTP_HOST:?}" "${FTP_USER:?}" "${FTP_PASS:?}" "${FTP_THEME_DIR:?}"

LIST=()
case "$MODE" in
  all)   while IFS= read -r l; do LIST+=("$l"); done < <(git ls-files "$THEME_LOCAL") ;;
  since) while IFS= read -r l; do LIST+=("$l"); done < <(git diff --name-only --diff-filter=ACMR "$REF" -- "$THEME_LOCAL"; git ls-files --others --exclude-standard "$THEME_LOCAL") ;;
  files) LIST=("${FILES[@]}") ;;
esac
# keep only theme files that exist
UPLOAD=(); for f in "${LIST[@]}"; do case "$f" in "$THEME_LOCAL"/*) [ -f "$f" ] && UPLOAD+=("$f") ;; esac; done
[ ${#UPLOAD[@]} -gt 0 ] || { echo "Nothing to upload."; exit 0; }

echo "Target: ftps://$FTP_HOST${FTP_THEME_DIR}  (${#UPLOAD[@]} files)"
for f in "${UPLOAD[@]}"; do echo "  ${f#"$THEME_LOCAL"/}"; done
[ "$DRY" = 1 ] && { echo "(dry run, nothing uploaded)"; exit 0; }

# credentials go in a private netrc file, not on the command line
NETRC="$(mktemp)"; chmod 600 "$NETRC"; trap 'rm -f "$NETRC"' EXIT
printf 'machine %s login %s password %s\n' "$FTP_HOST" "$FTP_USER" "$FTP_PASS" > "$NETRC"

fail=0
for f in "${UPLOAD[@]}"; do
  rel="${f#"$THEME_LOCAL"/}"
  if curl -sS --fail --ssl-reqd --netrc-file "$NETRC" --ftp-create-dirs -T "$f" "ftp://$FTP_HOST${FTP_THEME_DIR}${rel}"; then
    echo "uploaded  $rel"
  else
    echo "FAILED    $rel  (a 530 login error means FTP is locked: unlock it in the hosting panel)"; fail=1
  fi
done

if [ -n "$VERIFY" ]; then
  code=$(curl -s -o /dev/null -w '%{http_code}' -A 'curl/8' "$VERIFY?cb=$RANDOM")
  echo "verify $VERIFY -> HTTP $code"
fi
exit $fail
